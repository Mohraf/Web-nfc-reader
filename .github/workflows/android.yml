name: Android APK

on:
  push:
    paths: ['android/**', 'js/**', 'index.html', 'styles.css', 'manifest.webmanifest', 'icons/**', '.github/workflows/android.yml']
  pull_request:
  workflow_dispatch:
    inputs:
      start_url:
        description: 'Optional hosted PWA URL to load instead of the bundled copy (https://...)'
        required: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug ${START_URL:+-PstartUrl=$START_URL}
        env:
          START_URL: ${{ github.event.inputs.start_url }}
      - uses: actions/upload-artifact@v4
        with:
          name: chip-id-reader-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
